name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      workflows: ${{ steps.filter.outputs.workflows }}
      shared: ${{ steps.filter.outputs.shared }}
      central-api: ${{ steps.filter.outputs.central-api }}
      central-web: ${{ steps.filter.outputs.central-web }}
      local-app: ${{ steps.filter.outputs.local-app }}
      containers: ${{ steps.filter.outputs.containers }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Detect changed modules
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
            shared:
              - 'src/Shared/**'
              - 'tests/PlanCope.Shared.Tests/**'
              - 'tests/PlanCope.SyncCompat.Tests/**'
              - 'tools/PlanCope.RosterCrypto/**'
              - 'tools/PlanCope.RosterCrypto.Tests/**'
              - 'Directory.Packages.props'
              - 'Directory.Build.props'
              - 'NuGet.config'
              - 'dotnet-tools.json'
              - 'PlanCope.slnx'
              - '.editorconfig'
              - 'global.json'
            central-api:
              - 'src/Central/PlanCope.Central.Api/**'
              - 'src/Central/PlanCope.Central.Migrations/**'
              - 'tests/PlanCope.Central.Api.Tests/**'
              - 'tools/PlanCope.RosterReleaseTool/**'
            central-web:
              - 'src/Central/PlanCope.Central.Web/**'
              - 'package.json'
              - 'package-lock.json'
            local-app:
              - 'src/Local/**'
              - 'tests/PlanCope.Local.Api.Tests/**'
              - 'tests/PlanCope.Local.Host.Tests/**'
              - 'tests/PlanCope.E2E.Tests/**'
              - 'package.json'
              - 'package-lock.json'
            containers:
              - 'deploy/**'
              - 'src/Central/PlanCope.Central.Api/Dockerfile'
              - 'src/Central/PlanCope.Central.Web/Dockerfile'
              - 'src/Central/PlanCope.Central.Api/**'
              - 'src/Central/PlanCope.Central.Migrations/**'
              - 'src/Central/PlanCope.Central.Web/**'
              - 'package.json'
              - 'package-lock.json'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'NuGet.config'
              - 'dotnet-tools.json'

  central-api:
    name: central-api
    needs: changes
    if: needs.changes.outputs.central-api == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.workflows == 'true'
    uses: ./.github/workflows/ci-central-api.yml

  central-web:
    name: central-web
    needs: changes
    if: needs.changes.outputs.central-web == 'true' || needs.changes.outputs.workflows == 'true'
    uses: ./.github/workflows/ci-central-web.yml

  local-app:
    name: local-app
    needs: changes
    if: needs.changes.outputs.local-app == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.workflows == 'true'
    uses: ./.github/workflows/ci-local-app.yml

  containers:
    name: containers
    needs: changes
    if: needs.changes.outputs.containers == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.workflows == 'true'
    uses: ./.github/workflows/ci-containers.yml

  security:
    name: security
    needs: changes
    if: needs.changes.outputs.central-api == 'true' || needs.changes.outputs.central-web == 'true' || needs.changes.outputs.local-app == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.containers == 'true' || needs.changes.outputs.workflows == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/ci-security.yml

  ci:
    name: ci
    if: always()
    needs: [changes, central-api, central-web, local-app, containers, security]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs passed
        run: |
          for result in \
            "${{ needs.changes.result }}" \
            "${{ needs.central-api.result }}" \
            "${{ needs.central-web.result }}" \
            "${{ needs.local-app.result }}" \
            "${{ needs.containers.result }}" \
            "${{ needs.security.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "One or more required jobs failed or was cancelled: $result"
              exit 1
            fi
          done
          echo "All required jobs passed or were skipped."
