name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dotnet:
    name: dotnet
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore PlanCope.slnx
      - name: Build (warnings as errors)
        run: dotnet build PlanCope.slnx --configuration Release --no-restore -warnaserror
      - name: Test
        run: dotnet test PlanCope.slnx --configuration Release --no-build --logger "console;verbosity=normal"
      - name: Build PlanCope.Local.Host (WinForms)
        run: dotnet build src/Local/PlanCope.Local.Host/PlanCope.Local.Host.csproj --configuration Release --no-restore

  js:
    name: js
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test Central Web (Vitest)
        run: npm run test --workspace plancope-central-web
      - name: Test ClientApp (Vitest, if configured)
        run: npm run test --workspace plancope-local-host-ui --if-present
      - name: Build Central Web
        run: npm run build --workspace plancope-central-web
      - name: Build ClientApp
        run: npm run build --workspace plancope-local-host-ui

  containers:
    name: containers
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-password
      ConnectionStrings__CentralDatabase: "Server=postgres;Port=5432;Database=plan_cope_central;User Id=plancope;Password=ci-only-password;"
      Auth__SigningKey: ci-only-signing-key-0123456789abcdefghijklmnop
      GeApi__Username: ci-user
      GeApi__Password: ci-password
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          docker-images: false
          large-packages: true
          swap-storage: false
      - name: Validate Coolify compose config
        run: docker compose -f deploy/compose.coolify.yml config
      - name: Build images (no push)
        run: docker compose -f deploy/compose.coolify.yml build
      - name: Run smoke test (migrate + api health check)
        run: ./deploy/smoke.sh
