name: CI Local App

on:
  workflow_call:

jobs:
  local-app:
    name: local-app
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Build (warnings as errors)
        shell: bash
        run: |
          set -e
          for proj in \
            src/Local/PlanCope.Local.Host/PlanCope.Local.Host.csproj \
            tests/PlanCope.Local.Api.Tests/PlanCope.Local.Api.Tests.csproj \
            tests/PlanCope.Local.Host.Tests/PlanCope.Local.Host.Tests.csproj \
            tests/PlanCope.E2E.Tests/PlanCope.E2E.Tests.csproj; do
            dotnet build "$proj" --configuration Release -warnaserror
          done
      - name: Test
        shell: bash
        run: |
          set -e
          for proj in \
            tests/PlanCope.Local.Api.Tests/PlanCope.Local.Api.Tests.csproj \
            tests/PlanCope.Local.Host.Tests/PlanCope.Local.Host.Tests.csproj \
            tests/PlanCope.E2E.Tests/PlanCope.E2E.Tests.csproj; do
            dotnet test "$proj" --configuration Release --no-build --logger "console;verbosity=normal"
          done
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test ClientApp (Vitest, if configured)
        run: npm run test --workspace plancope-local-host-ui --if-present
      - name: Build ClientApp
        run: npm run build --workspace plancope-local-host-ui
