name: CI Central Web

on:
  workflow_call:

jobs:
  central-web:
    name: central-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test Central Web (Vitest)
        run: npm run test --workspace plancope-central-web
      - name: Build Central Web
        run: npm run build --workspace plancope-central-web
