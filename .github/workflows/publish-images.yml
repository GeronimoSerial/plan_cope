name: Publish Images

# Publishes the three Central images to GHCR on every merge to main.
#
# This exists because `ci-containers.yml` builds images and throws them away
# ("Build images (no push)"). Coolify pulls `:latest` from GHCR, so without a
# publisher production stays frozen on whichever image was pushed by hand last.
# That is exactly what happened: production ran the 2026-09-10 build for weeks.
#
# Publishing is NOT deploying. Nothing here touches production — see
# deploy-production.yml, which is manual on purpose.

on:
  push:
    branches: [main]
    paths:
      - "src/Central/**"
      - "src/Shared/**"
      - "deploy/**"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch:

concurrency:
  group: publish-images
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: plan-cope-central-api
            dockerfile: src/Central/PlanCope.Central.Api/Dockerfile
            target: runtime
          - image: plan-cope-central-migrate
            dockerfile: src/Central/PlanCope.Central.Api/Dockerfile
            target: migrate
          - image: plan-cope-central-web
            dockerfile: src/Central/PlanCope.Central.Web/Dockerfile
            target: ""
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          large-packages: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          # `latest` is what Coolify pulls; the sha tag is what makes a rollback
          # possible — without it "redeploy the previous build" has no address.
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Report
        run: |
          echo "### Published \`${{ matrix.image }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`:sha-${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
