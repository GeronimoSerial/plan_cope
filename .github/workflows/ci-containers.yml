name: CI Containers

on:
  workflow_call:

jobs:
  containers:
    name: containers
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-password
      ConnectionStrings__CentralDatabase: "Server=postgres;Port=5432;Database=plan_cope_central;User Id=plancope;Password=ci-only-password;"
      Auth__SigningKey: ci-only-signing-key-0123456789abcdefghijklmnop
      GeApi__Username: ci-user
      GeApi__Password: ci-password
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          docker-images: false
          large-packages: true
          swap-storage: false
      - name: Validate compose config
        run: docker compose -f deploy/compose.ci.yml config
      - name: Build images (no push)
        run: docker compose -f deploy/compose.ci.yml build
      - name: Run smoke test (migrate + api health check)
        run: ./deploy/smoke.sh
