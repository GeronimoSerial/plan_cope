# Used for local Docker Compose parity and the CI smoke test only. Coolify does NOT use this file — production consumes prebuilt images from GHCR directly (see docs/plan-cicd-batches.md).
name: plan-cope

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plan_cope_central}
      POSTGRES_USER: ${POSTGRES_USER:-plancope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: ..
      dockerfile: src/Central/PlanCope.Central.Api/Dockerfile
      target: migrate
    restart: "no"
    environment:
      ConnectionStrings__CentralDatabase: ${ConnectionStrings__CentralDatabase:?ConnectionStrings__CentralDatabase is required}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: src/Central/PlanCope.Central.Api/Dockerfile
      target: runtime
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__CentralDatabase: ${ConnectionStrings__CentralDatabase:?ConnectionStrings__CentralDatabase is required}
      Auth__SigningKey: ${Auth__SigningKey:?Auth__SigningKey is required}
      GeApi__Username: ${GeApi__Username:?GeApi__Username is required}
      GeApi__Password: ${GeApi__Password:?GeApi__Password is required}
    expose:
      - "8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: src/Central/PlanCope.Central.Web/Dockerfile
    environment:
      CENTRAL_API_URL: http://api:8080
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
